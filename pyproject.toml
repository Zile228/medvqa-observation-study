[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medvqa-observation-study"
version = "1.0.0"
description = "Reproducible evaluation of intermediate image observations in medical visual question answering."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.4", "pandas==3.0.6", "Pillow>=11.3"]

[project.optional-dependencies]
analysis = ["scipy==1.18.1", "statsmodels==0.15.0"]
api = ["openai==2.54.0", "tiktoken==0.12.0"]
models = ["transformers==4.49.0", "accelerate==1.3.0", "tokenizers==0.21.0", "bitsandbytes==0.45.2"]
data = ["huggingface-hub>=0.29"]
dev = ["pytest==9.1.1", "ruff==0.17.2", "nbformat==5.11.1"]

[project.scripts]
medvqa-analyze = "medvqa.analysis.run_all:main"
medvqa-pilot-check = "medvqa.analysis.pilot_gate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["medvqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["resources"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "D200", "D205", "D210", "D300", "D400"]

[tool.ruff.format]
docstring-code-format = true
